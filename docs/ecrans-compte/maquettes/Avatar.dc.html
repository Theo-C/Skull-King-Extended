<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{size}}px; height: {{size}}px; flex: none; border-radius: 50%; overflow: hidden; background: {{color}}; box-shadow: {{ring}};">
<sc-if value="{{isInit}}" hint-placeholder-val="{{false}}">
<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'IM Fell English SC', serif; font-size: {{fs}}px; color: #1b140e;">{{letter}}</div>
</sc-if>
<sc-if value="{{isArt}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 100 100" style="width: 100%; height: 100%; display: block;" aria-hidden="true">
<circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"></circle>
<sc-if value="{{h.hair}}" hint-placeholder-val="{{false}}"><path d="M35 48c-7 14-7 30-1 42h7c-4-11-4-25 0-38zM65 48c7 14 7 30 1 42h-7c4-11 4-25 0-38z" fill="#15110E"></path></sc-if>
<path d="M16 102c3-25 17-35 34-35s31 10 34 35z" fill="#15110E"></path>
<path d="M44 58h12v12H44z" fill="#15110E"></path>
<ellipse cx="50" cy="48" rx="14" ry="17" fill="#15110E"></ellipse>
<sc-if value="{{h.tricorne}}" hint-placeholder-val="{{false}}"><path d="M23 40c8-17 46-17 54 0-9 4-45 4-54 0z" fill="#15110E"></path><path d="M24 40c11 4 41 4 52 0" fill="none" stroke="#C9A24A" stroke-width="2.5"></path></sc-if>
<sc-if value="{{h.bandana}}" hint-placeholder-val="{{false}}"><path d="M35 42c1-14 29-14 30 0z" fill="#9E2A22"></path><path d="M64 39l11 5-7 5z" fill="#9E2A22"></path></sc-if>
<sc-if value="{{h.plume}}" hint-placeholder-val="{{false}}"><path d="M19 43c10-7 52-7 62 0-10 4-52 4-62 0z" fill="#15110E"></path><path d="M36 41c0-14 28-14 28 0z" fill="#15110E"></path><path d="M60 34c9-13 22-15 28-10-9 0-15 4-22 12z" fill="#E3C47A"></path></sc-if>
<sc-if value="{{h.bicorne}}" hint-placeholder-val="{{false}}"><path d="M20 41l30-16 30 16c-15 6-45 6-60 0z" fill="#15110E"></path><circle cx="50" cy="33" r="3.5" fill="#C9A24A"></circle></sc-if>
<sc-if value="{{h.patch}}" hint-placeholder-val="{{false}}"><path d="M36 46l28 10" stroke="#C9A24A" stroke-width="1.5"></path><ellipse cx="44" cy="50" rx="5" ry="4" fill="#C9A24A"></ellipse></sc-if>
<sc-if value="{{h.crown}}" hint-placeholder-val="{{false}}"><path d="M34 37l4-15 6 9 6-11 6 11 6-9 4 15z" fill="#E3C47A"></path></sc-if>
<sc-if value="{{h.parrot}}" hint-placeholder-val="{{false}}"><path d="M72 76c-5-11 1-20 8-18 5 2 5 9 0 13z" fill="#3E8E4E"></path><circle cx="78" cy="61" r="1.6" fill="#EFE3C8"></circle><path d="M81 59l5 2-5 2z" fill="#E3C47A"></path></sc-if>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"v":{"editor":"int","default":0,"min":-1,"max":7},"letter":{"editor":"text","default":"T"},"color":{"editor":"color","default":"#d9b25a"},"size":{"editor":"int","default":56},"ring":{"editor":null},"$preview":{"width":56,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.v == null ? 0 : Number(this.props.v), size = Number(this.props.size) || 56;
    var STY = [['tricorne'], ['bandana'], ['plume'], ['bicorne'], ['bandana', 'patch'], ['crown'], ['hair', 'tricorne'], ['tricorne', 'parrot']];
    var h = { tricorne: false, bandana: false, plume: false, bicorne: false, patch: false, crown: false, hair: false, parrot: false };
    (STY[v] || []).forEach(k => { h[k] = true; });
    return { size: size, fs: Math.round(size * .45), color: this.props.color || '#d9b25a', letter: this.props.letter || '?',
      ring: this.props.ring || '0 0 0 2px #1b140e', isInit: v < 0, isArt: v >= 0, h: h };
  }
}
</script>
</body>
</html>
