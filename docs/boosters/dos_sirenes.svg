.art{position:absolute;left:0;right:0;top:44px;bottom:44px;background:url(/dos2/art_profondeurs.jpg) center 30%/cover}
.crimp{position:absolute;left:0;right:0;height:46px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 3px,rgba(255,255,255,.22) 3px 5px,rgba(0,0,0,0) 5px 10px),linear-gradient(180deg,#2fc6c0,#0d3b40 45%,#2fc6c0 70%,#0d3b40)}
.crimp.t{top:0}.crimp.b{bottom:0}
.crimp::after{content:'';position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,#7a5418,#f6dc8a,#b8862e,#fff1c2,#9a6a1f)}
.crimp.t::after{bottom:0}.crimp.b::after{top:0}
.top{position:absolute;left:0;right:0;top:46px;height:74px;background:linear-gradient(180deg,rgba(6,8,10,.88),rgba(6,8,10,0));text-align:center}
.logo{font-family:"Pirata One";font-size:30px;line-height:58px;letter-spacing:.02em;background:linear-gradient(100deg,#7a5418,#f6dc8a 30%,#fff1c2 45%,#b8862e 60%,#e8c36a);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
.band{position:absolute;left:0;right:0;bottom:46px;height:190px;background:linear-gradient(180deg,rgba(6,8,10,0),rgba(6,8,10,.86) 38%,rgba(6,8,10,.94));text-align:center}
.name{position:absolute;left:0;right:0;top:66px;font-family:"Pirata One";font-size:58px;line-height:1;background:linear-gradient(100deg,#7a5418,#f6dc8a 25%,#fff6cf 40%,#c99a3c 55%,#fff3c4 70%,#b8862e);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 -1px 0 rgba(40,22,0,.9)) drop-shadow(0 1.5px 0 rgba(255,236,170,.5)) drop-shadow(0 3px 4px rgba(0,0,0,.8))}
.sub{position:absolute;left:0;right:0;top:136px;font-family:"Fell";font-size:15px;letter-spacing:.22em;color:#f2e7cd}
.rule{position:absolute;left:90px;right:90px;top:52px;height:1px;background:linear-gradient(90deg,transparent,#2fc6c0,transparent)}
.dia{position:absolute;left:50%;top:46px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:#2fc6c0;box-shadow:0 0 10px #2fc6c0}
.five{position:absolute;right:22px;top:58px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2,#d9ac4c 50%,#7a5418);box-shadow:0 0 0 2px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Pirata One";color:#3a2508;line-height:.9}
.five b{font-size:26px;font-weight:400}.five i{font-style:normal;font-family:"Fell";font-size:10px;letter-spacing:.08em}
.pillow{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,0) 6%,rgba(255,255,255,0) 40%,rgba(255,255,255,.12) 50%,rgba(255,255,255,0) 60%,rgba(255,255,255,0) 94%,rgba(255,255,255,.25)),linear-gradient(180deg,rgba(0,0,0,.25),transparent 12%,transparent 88%,rgba(0,0,0,.3));pointer-events:none}
.sheen{position:absolute;inset:0;background:linear-gradient(118deg,transparent 30%,rgba(255,255,255,.28) 41%,rgba(190,235,255,.18) 46%,transparent 56%);mix-blend-mode:screen}
.wr{position:absolute;inset:0;background:repeating-linear-gradient(176deg,transparent 0 60px,rgba(255,255,255,.05) 62px,transparent 66px);mix-blend-mode:screen}
.seam{position:absolute;top:46px;bottom:46px;left:50%;width:14px;margin-left:-7px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.12),rgba(0,0,0,.18));opacity:.0}
</style></head><body><div class="p"><div class="art"></div><div class="top"><div class="logo">Le Pli des Pirates</div></div><div class="five"><b>5</b><i>CARTES</i></div>
<div class="band"><div class="rule"></div><div class="dia"></div><div class="name">Profondeurs</div><div class="sub">SÉRIE 1 · LES SEPT MERS</div></div>
<div class="crimp t"></div><div class="crimp b"></div><div class="wr"></div><div class="sheen"></div><div class="pillow"></div></div></body></html>