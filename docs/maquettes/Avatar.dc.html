<script type="text/x-dc" data-dc-script data-props='{"v":{"editor":"int","default":0,"min":-1,"max":7},"letter":{"editor":"text","default":"T"},"color":{"editor":"color","default":"#d9b25a"},"size":{"editor":"int","default":56},"ring":{"editor":null},"look":{"editor":null},"locked":{"editor":"bool","default":false},"$preview":{"width":56,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props, v = p.v == null ? 0 : Number(p.v), size = Number(p.size) || 56;
    // Préréglages des joueurs d'exemple (compatibilité avec v = 0..7)
    var PRE = [
      { skin: 0, hair: 'long', hc: 4, beard: 'none', hat: 'tricorne', htc: '#2a3142', bg: 'nuit' },
      { skin: 3, hair: 'none', hc: 0, beard: 'mous', hat: 'bandana', htc: '#9e2a22', neck: 'perles', bg: 'mer' },
      { skin: 1, hair: 'meche', hc: 1, beard: 'short', hat: 'plume', htc: '#1d1814', neck: 'foulard', nkc: '#9e2a22', bg: 'mer', frame: 'corde' },
      { skin: 2, hair: 'court', hc: 0, beard: 'long', hat: 'bicorne', htc: '#15110e', face: 'cicatrice', bg: 'tempete' },
      { skin: 4, hair: 'court', hc: 0, beard: 'short', hat: 'bandana', htc: '#2f5f8a', face: 'patch', bg: 'mer' },
      { skin: 1, hair: 'long', hc: 5, beard: 'long', hat: 'couronne', bg: 'or', frame: 'or' },
      { skin: 5, hair: 'chignon', hc: 0, beard: 'none', face: 'lunettes', neck: 'medaillon', bg: 'couchant' },
      { skin: 0, hair: 'court', hc: 3, beard: 'none', hat: 'tricorne', htc: '#3a2a1c', pet: 'perroquet', ptc: '#3e8e4e', bg: 'taverne' }
    ];
    var L = Object.assign({}, PRE[v] || PRE[0], p.look || {});
    var SK = [['#f3d2b3', '#d9ab88'], ['#e6b48f', '#c48e69'], ['#c98e66', '#a66f4b'], ['#a56a45', '#83512f'], ['#7a4a2c', '#5e371f'], ['#5a3420', '#43261a']];
    var HC = ['#1d1510', '#4a2c1a', '#8a5a2b', '#c9a14a', '#a33a26', '#d8d2c4'];
    var BG = {
      mer: { c1: '#16434a', c2: '#2a6f73', c3: '#0f3238', waves: true },
      nuit: { c1: '#0f1830', c2: '#1d2b52', stars: true },
      couchant: { c1: '#5a2a4a', c2: '#c0613e', sun: true },
      tempete: { c1: '#2a2f36', c2: '#4c5560', bolt: true },
      taverne: { c1: '#3a2416', c2: '#6b4226', lamp: true },
      or: { c1: '#6b4c14', c2: '#c9a14a' }
    };
    var sk = SK[L.skin == null ? 1 : L.skin] || SK[1];
    var flag = (val, keys) => { var o = {}; keys.forEach(k => { o[k] = val === k; }); return o; };
    var hair = L.hair || 'court';
    return {
      size: size, fs: Math.round(size * .45), color: p.color || '#d9b25a', letter: p.letter || '?',
      ring: p.ring || '0 0 0 2px #1b140e', isInit: v < 0, isArt: v >= 0,
      filter: p.locked ? 'grayscale(1) brightness(.35)' : 'none',
      skin: sk[0], skinD: sk[1], hc: typeof L.hc === 'number' ? HC[L.hc] : (L.hc || HC[0]),
      coat: L.coat || p.color || '#5e1714',
      bg: Object.assign({ c3: '#000', waves: false, stars: false, sun: false, bolt: false, lamp: false }, BG[L.bg || 'mer']),
      hb: { long: hair === 'long', queue: hair === 'queue' },
      hf: flag(hair, ['court', 'meche', 'long', 'boucles', 'chignon', 'tresse']),
      bd: { short: L.beard === 'short', long: L.beard === 'long', mous: L.beard === 'mous' || L.beard === 'short' || L.beard === 'long' },
      fa: flag(L.face, ['patch', 'lunettes', 'monocle', 'cicatrice', 'khol']),
      nk: flag(L.neck, ['foulard', 'perles', 'medaillon', 'jabot']), nkc: L.nkc || '#9e2a22',
      ht: flag(L.hat, ['tricorne', 'bicorne', 'bandana', 'plume', 'couronne', 'foulard', 'amiral']), htc: L.htc || '#1d1814',
      pt: flag(L.pet, ['perroquet', 'singe', 'mouette', 'poulpe']), ptc: L.ptc || '#3e8e4e',
      fr: flag(L.frame, ['corde', 'or', 'tentacules'])
    };
  }
}
</script>
