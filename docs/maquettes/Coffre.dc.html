<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ouverture de coffre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
button{font-family:'Alegreya Sans',sans-serif}
button:focus-visible{outline:2px solid #ead08a;outline-offset:3px}
.gold{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:10px;border:0;background:linear-gradient(180deg,#e2bd62,#b78c33);color:#2b2117;font-weight:800;font-size:18px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(90,60,10,.5),0 2px 0 #6b4c14}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:10px;border:1px solid rgba(234,208,138,.45);background:rgba(0,0,0,.3);color:#f2e7cd;font-weight:800;font-size:16px;cursor:pointer}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(234,208,138,.3);background:transparent;color:#d9cdb6;font-weight:800;font-size:13px;cursor:pointer}
.chip.on{background:#ead08a;color:#2b2117;border-color:#ead08a}

/* la teinte de la lueur passe du blanc à la couleur de rareté en douceur */
.glowC{transition:background 1s ease,box-shadow 1s ease,opacity .8s ease,transform .8s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-2.5deg)}30%{transform:rotate(2.5deg)}45%{transform:rotate(-2deg)}60%{transform:rotate(2deg)}75%{transform:rotate(-1deg)}}
.shake{animation:shake .45s ease-in-out 2}
@keyframes hum{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.hum{animation:hum .35s ease-in-out infinite}
.lidCrack{transition:transform .9s cubic-bezier(.3,.7,.3,1);transform:translateY(-14px) rotate(-5deg)}
.lidOpen{transition:transform .5s cubic-bezier(.2,.9,.3,1.1);transform:translate(-36px,-120px) rotate(-34deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{animation:spin 18s linear infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes burst{from{transform:scale(.3);opacity:1}to{transform:scale(3.2);opacity:0}}
.burst{animation:burst .8s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.sp{position:absolute;border-radius:50%;animation:spark var(--t) cubic-bezier(.1,.7,.3,1) var(--d) forwards}
@keyframes rise{0%{transform:translateY(150px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.rise{animation:rise .8s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.float{animation:float 3.4s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.up{animation:up .45s ease-out both}
@keyframes star{0%{transform:scale(0);opacity:0}70%{transform:scale(1.3);opacity:1}100%{transform:none;opacity:1}}
.star{animation:star .35s cubic-bezier(.2,.8,.3,1.4) both}
@keyframes melt{to{transform:scale(.15);opacity:0}}
.melt{animation:melt .5s ease-in forwards}
@keyframes coin{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:.2}}
.cn{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c4 0 12%,#e2bd62 40%,#a77b22 100%);box-shadow:inset 0 0 0 1.5px rgba(90,60,10,.6);animation:coin .9s cubic-bezier(.5,0,.6,1) var(--d) both}
@keyframes bump{0%,100%{transform:none}40%{transform:scale(1.3)}}
.bump{animation:bump .3s ease-out 1s 3}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: radial-gradient(ellipse at 50% 60%, #2a1f17 0%, #120e0b 62%); color: #efe6d2; font-family: 'Alegreya Sans', sans-serif;">

<header style="position: absolute; left: 0; top: 0; width: 1440px; height: 72px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 16px; z-index: 30;">
<span style="font-family: 'IM Fell English SC', serif; font-size: 28px; color: #ead08a;">Coffre de victoire</span>
<span style="font-size: 15px; color: #a8987f;">{{chestsLeft}}</span>
<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: rgba(0,0,0,.4); border: 1px solid rgba(234,208,138,.3);"><span class="{{coinCls}}" style="display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff2c4 0 12%, #e2bd62 40%, #a77b22 100%);"></span><b style="font-family: 'Pirata One', cursive; font-size: 22px; color: #ead08a;">{{coins}}</b><span style="font-size: 14px; color: #d9cdb6;">pièces</span></span>
<sc-if value="{{canSkip}}" hint-placeholder-val="{{false}}"><button class="ghost" onClick="{{skip}}" style="min-height: 40px; padding: 0 16px; font-size: 14px;">Passer</button></sc-if>
</header>

<!-- halo derrière le coffre -->
<div class="glowC" style="position: absolute; left: 370px; top: 110px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, {{glowSoft}} 0%, transparent 62%); opacity: {{haloOp}}; transform: scale({{haloScale}}); z-index: 1;"></div>
<!-- rayons qui sortent du coffre -->
<div style="position: absolute; left: 420px; top: 140px; width: 600px; height: 600px; opacity: {{raysOp}}; transition: opacity .8s; z-index: 2; pointer-events: none;">
<div class="rays" style="width: 100%; height: 100%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, {{glow}} 0deg 5deg, transparent 5deg 20deg); -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.45) 30%, transparent 64%); mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.45) 30%, transparent 64%); transition: background 1s;"></div>
</div>

<!-- socle -->
<svg viewBox="0 0 1440 900" style="position: absolute; inset: 0; width: 1440px; height: 900px; z-index: 3;" aria-hidden="true">
<ellipse cx="720" cy="640" rx="250" ry="38" fill="#000" opacity=".45"></ellipse>
<path d="M500 630c0-24 98-38 220-38s220 14 220 38v24c0 24-98 38-220 38s-220-14-220-38z" fill="#3a2416"></path>
<ellipse cx="720" cy="630" rx="220" ry="36" fill="#5a3720"></ellipse>
<ellipse cx="720" cy="630" rx="220" ry="36" fill="none" stroke="#c9a14a" stroke-width="2" opacity=".6"></ellipse>
</svg>

<!-- coffre -->
<div style="position: absolute; left: 560px; top: 280px; width: 320px; height: 340px; z-index: 5; opacity: {{chestOp}}; transition: opacity .8s;">
<div class="{{chestCls}}" style="position: absolute; inset: 0; transform-origin: 50% 95%;">
<svg viewBox="0 0 260 150" style="position: absolute; left: 0; top: 155px; width: 320px; height: 185px;" aria-hidden="true">
<defs><linearGradient id="cgw" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8a5833"></stop><stop offset="1" stop-color="#4a2b16"></stop></linearGradient></defs>
<rect x="10" y="0" width="240" height="142" rx="8" fill="url(#cgw)" stroke="#2a170b" stroke-width="3"></rect>
<path d="M14 48h232M14 96h232" stroke="#3a2214" stroke-width="2" opacity=".7"></path>
<rect x="36" y="0" width="18" height="142" fill="#c9a14a" stroke="#6b4c14" stroke-width="1.5"></rect><rect x="206" y="0" width="18" height="142" fill="#c9a14a" stroke="#6b4c14" stroke-width="1.5"></rect>
<circle cx="45" cy="24" r="3" fill="#6b4c14"></circle><circle cx="45" cy="118" r="3" fill="#6b4c14"></circle><circle cx="215" cy="24" r="3" fill="#6b4c14"></circle><circle cx="215" cy="118" r="3" fill="#6b4c14"></circle>
<rect x="10" y="130" width="240" height="12" rx="4" fill="#c9a14a" stroke="#6b4c14" stroke-width="1.5"></rect>
<path d="M108 0h44v44c0 10-10 16-22 16s-22-6-22-16z" fill="#e3c47a" stroke="#6b4c14" stroke-width="2"></path>
<circle cx="130" cy="22" r="6" fill="#2a170b"></circle><path d="M127 26h6l2 16h-10z" fill="#2a170b"></path>
</svg>
<!-- fente lumineuse -->
<div class="glowC" style="position: absolute; left: 18px; top: 150px; width: 284px; height: 10px; border-radius: 5px; background: {{glow}}; opacity: {{seamOp}}; box-shadow: 0 0 {{seamBlur}}px {{seamSpread}}px {{glow}};"></div>
<div class="{{lidCls}}" style="position: absolute; left: 0; top: 15px; width: 320px; height: 143px; transform-origin: 8% 100%;">
<svg viewBox="0 0 260 116" style="width: 320px; height: 143px; display: block;" aria-hidden="true">
<defs><linearGradient id="clw" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9a6439"></stop><stop offset="1" stop-color="#6b4226"></stop></linearGradient></defs>
<path d="M10 112V64C10 22 62 4 130 4s120 18 120 60v48z" fill="url(#clw)" stroke="#2a170b" stroke-width="3"></path>
<path d="M40 112V30M220 112V30" stroke="#c9a14a" stroke-width="18"></path>
<path d="M14 64C30 34 80 22 130 22s100 12 116 42" fill="none" stroke="#3a2214" stroke-width="2" opacity=".6"></path>
<rect x="10" y="100" width="240" height="12" rx="4" fill="#c9a14a" stroke="#6b4c14" stroke-width="1.5"></rect>
<circle cx="40" cy="50" r="3" fill="#6b4c14"></circle><circle cx="220" cy="50" r="3" fill="#6b4c14"></circle>
<path d="M112 100h36v12h-36z" fill="#e3c47a" stroke="#6b4c14" stroke-width="1.5"></path>
</svg>
</div>
</div>
</div>

<!-- éclat à l'ouverture -->
<sc-if value="{{showBurst}}" hint-placeholder-val="{{false}}">
<div class="burst" style="position: absolute; left: 620px; top: 340px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, {{glow}} 40%, transparent 70%); z-index: 7; pointer-events: none;"></div>
<div style="position: absolute; left: 720px; top: 440px; width: 0; height: 0; z-index: 7; pointer-events: none;">
<sc-for list="{{sparks}}" as="s" hint-placeholder-count="24"><span class="sp" style="--dx: {{s.dx}}px; --dy: {{s.dy}}px; --t: {{s.t}}s; --d: {{s.d}}s; left: -4px; top: -4px; width: {{s.sz}}px; height: {{s.sz}}px; background: {{s.c}}; box-shadow: 0 0 10px {{s.c}};"></span></sc-for>
</div>
</sc-if>

<!-- objet -->
<sc-if value="{{showItem}}" hint-placeholder-val="{{false}}">
<div class="rise" style="position: absolute; left: 600px; top: 84px; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; z-index: 9;">
<div class="{{itemCls}}" style="filter: drop-shadow(0 0 24px {{glow}});">
<div class="float"><dc-import name="Objet" item="{{item}}" c="{{itemC}}" size="{{210}}" hint-size="210px,210px"></dc-import></div>
</div>
</div>
</sc-if>

<sc-if value="{{showText}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 420px; top: 704px; width: 600px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 10; text-align: center;">
<div class="up" style="display: flex; align-items: center; gap: 10px;">
<span style="font-size: 13px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: {{rc}};">{{rarLabel}}</span>
<span style="display: flex; gap: 3px;"><sc-for list="{{stars}}" as="s" hint-placeholder-count="4"><svg class="star" viewBox="0 0 24 24" style="width: 16px; height: 16px; animation-delay: {{s.d}}s;" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6z" fill="{{rc}}"></path></svg></sc-for></span>
</div>
<div class="up" style="font-family: 'IM Fell English SC', serif; font-size: 40px; line-height: 1.05; color: #f2e7cd; animation-delay: .15s;">{{name}}</div>
<div class="up" style="font-size: 15px; font-weight: 700; color: {{subInk}}; animation-delay: .3s;">{{slot}} · {{sub}}</div>
</div>
</sc-if>

<sc-if value="{{showCoins}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 709px; top: 200px; width: 0; height: 0; z-index: 26; pointer-events: none;">
<sc-for list="{{coinsFly}}" as="c" hint-placeholder-count="12"><span class="cn" style="--dx: {{c.dx}}px; --dy: {{c.dy}}px; --d: {{c.d}}s; left: {{c.l}}px; top: {{c.t}}px;"></span></sc-for>
</div>
</sc-if>

<sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 420px; top: 706px; width: 600px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 10;">
<button class="gold" onClick="{{start}}">Ouvrir le coffre</button>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 13px; color: #a8987f;">
<sc-for list="{{odds}}" as="o" hint-placeholder-count="4"><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{o.c}};"></span>{{o.label}} {{o.p}}</span></sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{showActions}}" hint-placeholder-val="{{false}}">
<div class="up" style="position: absolute; right: 32px; bottom: 28px; display: flex; gap: 10px; z-index: 12;">
<button class="ghost" onClick="{{again}}">Ouvrir le suivant</button>
<sc-if value="{{canWear}}" hint-placeholder-val="{{true}}"><button class="gold" onClick="{{reset}}">Équiper</button></sc-if>
<sc-if value="{{isDup}}" hint-placeholder-val="{{false}}"><button class="gold" onClick="{{reset}}">Continuer</button></sc-if>
</div>
</sc-if>

<div style="position: absolute; left: 24px; bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.5); border: 1px dashed rgba(234,208,138,.3); z-index: 30;">
<span style="font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #a8987f;">Démo · résultat</span>
<sc-for list="{{demo}}" as="o" hint-placeholder-count="5"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { out: 'leg', phase: 'idle', coins: 340, left: 3 };
  componentWillUnmount() { (this.t || []).forEach(clearTimeout); }
  later(ms, f) { (this.t = this.t || []).push(setTimeout(f, ms)); }
  clear() { (this.t || []).forEach(clearTimeout); this.t = []; }
  start() {
    if (this.state.phase !== 'idle') return;
    var out = this.state.out, t = 0, at = (d, ph) => { t += d; this.later(t, () => this.setState({ phase: ph })); };
    var hold = { com: 900, rare: 1200, epi: 1500, leg: 1900, dup: 900 }[out];   // plus c'est rare, plus la teinte se fait attendre
    this.setState({ phase: 'shake' });
    at(900, 'glow'); at(hold + 600, 'tint'); at(1300, 'open'); at(350, 'item');
    if (out === 'dup') { at(1600, 'convert'); this.later(t + 1200, () => this.setState({ phase: 'done', coins: this.state.coins + 30 })); }
    else at(900, 'done');
  }
  renderVals() {
    var st = this.state, out = st.out, ph = st.phase;
    var RAR = [
      { label: 'Commun', c: '#d6dde4', soft: 'rgba(214,221,228,.5)', p: '62 %' },
      { label: 'Rare', c: '#4fa8ff', soft: 'rgba(79,168,255,.55)', p: '26 %' },
      { label: 'Épique', c: '#c27dff', soft: 'rgba(194,125,255,.6)', p: '9 %' },
      { label: 'Légendaire', c: '#ffc94a', soft: 'rgba(255,201,74,.7)', p: '3 %' }
    ];
    var O = {
      com: { r: 0, item: 'bandana', c: '#2f5f8a', name: 'Bandana des mers', slot: 'Chapeau', sub: 'nouvel objet' },
      rare: { r: 1, item: 'monocle', name: "Monocle de l'armateur", slot: 'Yeux et visage', sub: 'nouvel objet' },
      epi: { r: 2, item: 'perles', name: 'Perles des sirènes', slot: 'Cou', sub: 'nouvel objet' },
      leg: { r: 3, item: 'poulpe', name: 'Poulpe des abysses', slot: 'Compagnon', sub: 'nouvel objet' },
      dup: { r: 0, item: 'tricorne', name: 'Tricorne', slot: 'Chapeau', sub: 'déjà possédé · +30 pièces' }
    }[out];
    var R = RAR[O.r], P = ['idle', 'shake', 'glow', 'tint', 'open', 'item', 'convert', 'done'], at = P.indexOf(ph);
    var tinted = at >= 3, white = { c: '#ffffff', soft: 'rgba(255,255,255,.45)' };
    var G = tinted ? R : white;
    var sparks = []; for (var k = 0; k < 26; k++) { var a = k / 26 * Math.PI * 2, d = 140 + (k * 53 % 160);
      sparks.push({ dx: Math.round(Math.cos(a) * d), dy: Math.round(Math.sin(a) * d * .7 - 40), sz: 4 + k % 4 * 2, t: (.7 + k % 4 * .15).toFixed(2), d: (k % 5 * .02).toFixed(2), c: k % 3 ? R.c : '#ffffff' }); }
    var coinsFly = []; for (var j = 0; j < 12; j++) coinsFly.push({ dx: 530 + (j % 3) * 6, dy: -164 - (j % 2) * 4, d: (j * .06).toFixed(2), l: ((j * 29) % 60) - 30, t: ((j * 17) % 40) - 20 });
    var reset = () => { this.clear(); this.setState({ phase: 'idle' }); };
    return {
      chestsLeft: st.left + ' coffres à ouvrir', coins: st.coins, coinCls: ph === 'convert' ? 'bump' : '',
      canSkip: at > 0 && at < 5,
      skip: () => { this.clear(); if (out === 'dup') { this.setState({ phase: 'convert' }); this.later(1200, () => this.setState({ phase: 'done', coins: this.state.coins + 30 })); } else this.setState({ phase: 'done' }); },
      glow: G.c, glowSoft: G.soft, rc: R.c,
      haloOp: at === 0 ? .08 : at === 1 ? .2 : at === 2 ? .55 : 1, haloScale: at >= 4 ? 1.15 : at === 3 ? 1 : .8,
      raysOp: at === 2 ? .35 : at >= 3 ? .6 : 0,
      seamOp: at === 0 ? .1 : at === 1 ? .5 : 1, seamBlur: [6, 14, 30, 44, 44, 44, 44, 44][at], seamSpread: [0, 2, 8, 14, 14, 14, 14, 14][at],
      chestCls: at === 0 ? 'bob' : at === 1 ? 'shake' : at === 2 || at === 3 ? 'hum' : '',
      chestOp: at >= 5 ? .55 : 1,
      lidCls: at >= 4 ? 'lidOpen' : at >= 2 ? 'lidCrack' : '',
      showBurst: ph === 'open' || ph === 'item', sparks: sparks,
      showItem: at >= 5, item: O.item, itemC: O.c || '#2f5f8a', itemCls: ph === 'convert' ? 'melt' : '',
      showText: at >= 5 && ph !== 'convert', rarLabel: R.label, name: O.name, slot: O.slot, sub: O.sub, subInk: out === 'dup' ? '#ead08a' : '#d9cdb6',
      stars: Array.from({ length: O.r + 1 }, (_, n) => ({ d: (.2 + n * .15).toFixed(2) })),
      showCoins: ph === 'convert', coinsFly: coinsFly,
      isIdle: ph === 'idle', start: () => this.start(), odds: RAR.map(r => ({ label: r.label, p: r.p, c: r.c })),
      showActions: ph === 'done', canWear: out !== 'dup', isDup: out === 'dup', reset: reset,
      again: () => { this.clear(); var nx = { com: 'rare', rare: 'epi', epi: 'leg', leg: 'dup', dup: 'com' }[out]; this.setState({ out: nx, phase: 'idle', left: Math.max(0, st.left - 1) }); },
      demo: [['com', 'Commun'], ['rare', 'Rare'], ['epi', 'Épique'], ['leg', 'Légendaire'], ['dup', 'Doublon']].map(x => ({ label: x[1], cls: 'chip' + (out === x[0] ? ' on' : ''), pick: () => { this.clear(); this.setState({ out: x[0], phase: 'idle' }); } }))
    };
  }
}
</script>
</body>
</html>
