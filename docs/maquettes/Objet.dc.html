<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Objet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<svg viewBox="0 0 120 120" style="width: {{size}}px; height: {{size}}px; display: block; overflow: visible; filter: {{filter}};" aria-hidden="true">
<defs>
<linearGradient id="og-gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff2c4"></stop><stop offset=".35" stop-color="#e8c76a"></stop><stop offset="1" stop-color="#9a6e1c"></stop></linearGradient>
<radialGradient id="og-glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"></stop><stop offset=".4" stop-color="#bfe3f2" stop-opacity=".55"></stop><stop offset="1" stop-color="#5b8fa6" stop-opacity=".35"></stop></radialGradient>
<radialGradient id="og-pearl" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"></stop><stop offset=".6" stop-color="#f1e6e4"></stop><stop offset="1" stop-color="#bba9b0"></stop></radialGradient>
<radialGradient id="og-purple" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#d9a8f5"></stop><stop offset=".55" stop-color="#9b5cc4"></stop><stop offset="1" stop-color="#5a2d7a"></stop></radialGradient>
<radialGradient id="og-green" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#8fd68f"></stop><stop offset="1" stop-color="#2f6f3a"></stop></radialGradient>
</defs>

<sc-if value="{{is.bandana}}" hint-placeholder-val="{{false}}">
<path d="M12 46c26-16 70-16 96 0L60 102z" fill="{{c}}"></path>

<circle cx="40" cy="52" r="3.2" fill="#f3e8cf"></circle><circle cx="60" cy="48" r="3.2" fill="#f3e8cf"></circle><circle cx="80" cy="52" r="3.2" fill="#f3e8cf"></circle><circle cx="50" cy="68" r="3.2" fill="#f3e8cf"></circle><circle cx="70" cy="68" r="3.2" fill="#f3e8cf"></circle><circle cx="60" cy="86" r="3.2" fill="#f3e8cf"></circle>
<path d="M102 44l16-8-3 14zM102 48l13 13-15-3z" fill="{{c}}"></path><circle cx="103" cy="46" r="5" fill="{{c}}" stroke="#000" stroke-opacity=".25"></circle>

<path d="M8 68c20-30 84-30 104 0-26 14-78 14-104 0z" fill="#4a2f1d"></path><path d="M8 68c20-30 84-30 104 0" fill="none" stroke="#7d5636" stroke-width="3"></path>
<path d="M10 68c26 14 74 14 100 0" fill="none" stroke="url(#og-gold)" stroke-width="5" stroke-linecap="round"></path>
<path d="M24 58c14-12 58-12 72 0" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"></path>
<circle cx="60" cy="72" r="5" fill="url(#og-gold)"></circle>
</sc-if>

<sc-if value="{{is.lunettes}}" hint-placeholder-val="{{false}}">
<path d="M18 58L4 50M102 58l14-8" stroke="url(#og-gold)" stroke-width="4" stroke-linecap="round"></path>
<circle cx="38" cy="62" r="19" fill="url(#og-glass)" stroke="url(#og-gold)" stroke-width="5"></circle>
<circle cx="82" cy="62" r="19" fill="url(#og-glass)" stroke="url(#og-gold)" stroke-width="5"></circle>
<path d="M55 58c3-5 7-5 10 0" fill="none" stroke="url(#og-gold)" stroke-width="4"></path>
<path d="M28 54c3-5 8-7 12-6M72 54c3-5 8-7 12-6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".85"></path>

<sc-if value="{{is.mouette}}" hint-placeholder-val="{{false}}">
<path d="M22 78c0-22 20-36 44-30 18 4 24 20 14 32-12 14-46 14-58-2z" fill="#f6f3ec"></path>
<path d="M40 60c10-22 34-34 58-30-16 6-28 16-36 32z" fill="#c9d1d8"></path>
<circle cx="80" cy="48" r="13" fill="#f6f3ec"></circle>
<path d="M92 48l16 3-16 5z" fill="#e3a83a"></path><circle cx="84" cy="45" r="2.2" fill="#15110e"></circle>
<path d="M30 92l-4 10M46 94l2 10" stroke="#e3a83a" stroke-width="3" stroke-linecap="round"></path>
</sc-if>

<sc-if value="{{is.monocle}}" hint-placeholder-val="{{false}}">
<path d="M74 74c8 10 6 18 14 24s14 2 20 12" fill="none" stroke="url(#og-gold)" stroke-width="3" stroke-dasharray="5 3" stroke-linecap="round"></path>
<circle cx="108" cy="110" r="5" fill="none" stroke="url(#og-gold)" stroke-width="3"></circle>
<circle cx="50" cy="50" r="32" fill="url(#og-glass)" stroke="url(#og-gold)" stroke-width="8"></circle>
<circle cx="50" cy="50" r="32" fill="none" stroke="#6b4c14" stroke-width="1.5" opacity=".6"></circle>
<path d="M30 38c6-10 16-14 26-12" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"></path>
<circle cx="66" cy="66" r="3" fill="#fff" opacity=".6"></circle>
</sc-if>

<sc-if value="{{is.perroquet}}" hint-placeholder-val="{{false}}">
<path d="M54 74l-14 40 22-30z" fill="#2f6fb0"></path><path d="M60 76l-4 40 14-34z" fill="#c0392b"></path>
<path d="M44 82c-12-22-2-48 22-50 20-2 30 18 22 36-6 14-28 28-44 14z" fill="url(#og-green)"></path>
<path d="M50 70c4-14 18-22 32-18-6 10-16 18-32 18z" fill="#2f6f3a" opacity=".8"></path>
<circle cx="74" cy="36" r="16" fill="url(#og-green)"></circle>
<path d="M86 32c10 0 14 8 10 16-2-6-6-8-12-6z" fill="#f2c14e" stroke="#9a6e1c" stroke-width="1.5"></path>
<circle cx="78" cy="32" r="5" fill="#fff"></circle><circle cx="79" cy="32" r="2.6" fill="#15110e"></circle>
</sc-if>

<sc-if value="{{is.perles}}" hint-placeholder-val="{{false}}">
<sc-for list="{{pearls}}" as="p" hint-placeholder-count="16"><circle cx="{{p.x}}" cy="{{p.y}}" r="{{p.r}}" fill="url(#og-pearl)" stroke="#9a8790" stroke-width=".6"></circle></sc-for>
<path d="M60 78v6" stroke="url(#og-gold)" stroke-width="3"></path>
<circle cx="60" cy="92" r="9" fill="url(#og-pearl)" stroke="#9a8790"></circle>
</sc-if>

<sc-if value="{{is.patch}}" hint-placeholder-val="{{false}}">
<path d="M6 40c30 6 78 22 108 40" fill="none" stroke="#6b4226" stroke-width="5" stroke-linecap="round"></path>
<path d="M36 50c10-6 30-6 40 4 6 14-4 30-20 30S30 64 36 50z" fill="#3a2214" stroke="#8a5a34" stroke-width="2"></path>
<path d="M40 54c10-4 24-4 32 4 4 10-2 22-16 22" fill="none" stroke="url(#og-gold)" stroke-width="1.6" stroke-dasharray="3 3"></path>
<path d="M44 56c4-3 10-4 14-3" stroke="#fff" stroke-opacity=".25" stroke-width="2.5" stroke-linecap="round"></path>
</sc-if>

<sc-if value="{{is.poulpe}}" hint-placeholder-val="{{false}}">
<path d="M36 70c-10 14-24 16-28 30M48 76c-4 16-14 24-14 36M60 78c0 16 4 26 0 36M72 76c4 16 14 24 14 36M84 70c10 14 24 16 28 30" fill="none" stroke="#7a3fa0" stroke-width="9" stroke-linecap="round"></path>
<path d="M36 70c-10 14-24 16-28 30M48 76c-4 16-14 24-14 36M60 78c0 16 4 26 0 36M72 76c4 16 14 24 14 36M84 70c10 14 24 16 28 30" fill="none" stroke="#d9a8f5" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"></path>
<ellipse cx="60" cy="48" rx="34" ry="36" fill="url(#og-purple)"></ellipse>
<circle cx="46" cy="30" r="4" fill="#c58fe6" opacity=".8"></circle><circle cx="74" cy="26" r="3" fill="#c58fe6" opacity=".8"></circle><circle cx="80" cy="44" r="2.5" fill="#c58fe6" opacity=".8"></circle>
<ellipse cx="48" cy="54" rx="7" ry="8" fill="#fff"></ellipse><ellipse cx="72" cy="54" rx="7" ry="8" fill="#fff"></ellipse>
<circle cx="49" cy="56" r="3.6" fill="#15110e"></circle><circle cx="73" cy="56" r="3.6" fill="#15110e"></circle>
<path d="M54 68c4 3 8 3 12 0" fill="none" stroke="#3a1a52" stroke-width="2.5" stroke-linecap="round"></path>
</sc-if>

<sc-if value="{{is.couronne}}" hint-placeholder-val="{{false}}">
<path d="M14 90l-6-56 26 22 26-36 26 36 26-22-6 56z" fill="url(#og-gold)" stroke="#6b4c14" stroke-width="2.5" stroke-linejoin="round"></path>
<rect x="14" y="88" width="92" height="14" rx="3" fill="url(#og-gold)" stroke="#6b4c14" stroke-width="2.5"></rect>
<circle cx="60" cy="70" r="8" fill="#c0392b" stroke="#6b4c14" stroke-width="2"></circle><circle cx="34" cy="76" r="5.5" fill="#2f6fb0" stroke="#6b4c14" stroke-width="2"></circle><circle cx="86" cy="76" r="5.5" fill="#3e8e4e" stroke="#6b4c14" stroke-width="2"></circle>
<circle cx="8" cy="34" r="4" fill="url(#og-gold)"></circle><circle cx="60" cy="20" r="5" fill="url(#og-gold)"></circle><circle cx="112" cy="34" r="4" fill="url(#og-gold)"></circle>
<path d="M57 67c2-2 4-2 6 0" stroke="#fff" stroke-width="2" opacity=".7"></path>
</sc-if>

<sc-if value="{{is.medaillon}}" hint-placeholder-val="{{false}}">
<path d="M22 8c4 30 18 44 38 44S94 38 98 8" fill="none" stroke="url(#og-gold)" stroke-width="3" stroke-dasharray="5 3"></path>
<circle cx="60" cy="74" r="34" fill="url(#og-gold)" stroke="#6b4c14" stroke-width="3"></circle>
<circle cx="60" cy="74" r="26" fill="none" stroke="#6b4c14" stroke-width="1.5" opacity=".7"></circle>
<path d="M60 54l5.5 12.5 13.5 1.2-10.2 9 3 13.3L60 83l-11.8 7 3-13.3-10.2-9 13.5-1.2z" fill="#8a6620"></path>
<path d="M40 60c4-8 12-12 20-12" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"></path>
</sc-if>

<sc-if value="{{is.mystere}}" hint-placeholder-val="{{false}}">
<circle cx="60" cy="60" r="44" fill="#1b1f26" stroke="#8d99a3" stroke-width="3" stroke-dasharray="6 5"></circle>
<path d="M46 48c0-10 6-16 14-16s14 6 14 14c0 10-12 12-12 22M62 82v4" fill="none" stroke="#c9d1d8" stroke-width="7" stroke-linecap="round"></path>
</sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":"enum","options":["bandana","tricorne","lunettes","mouette","monocle","perroquet","perles","patch","poulpe","couronne","medaillon","mystere"],"default":"monocle"},"c":{"editor":"color","default":"#2f5f8a"},"size":{"editor":"int","default":120},"silhouette":{"editor":"bool","default":false},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    var it = this.props.item || 'monocle', is = {};
    ['bandana', 'tricorne', 'lunettes', 'mouette', 'monocle', 'perroquet', 'perles', 'patch', 'poulpe', 'couronne', 'medaillon', 'mystere'].forEach(k => { is[k] = k === it; });
    var pearls = [];
    for (var i = 0; i < 17; i++) { var a = Math.PI * (0.05 + 0.9 * i / 16); pearls.push({ x: (60 - Math.cos(a) * 46).toFixed(1), y: (24 + Math.sin(a) * 50).toFixed(1), r: (5 + Math.sin(a) * 1.6).toFixed(1) }); }
    return { is: is, c: this.props.c || '#2f5f8a', size: Number(this.props.size) || 120, pearls: pearls,
      filter: this.props.silhouette ? 'brightness(0)' : 'drop-shadow(0 6px 10px rgba(0,0,0,.45))' };
  }
}
</script>
</body>
</html>
