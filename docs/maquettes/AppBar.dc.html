<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Barre du site</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
.nl{color:#efe6d2;text-decoration:none;font-weight:700;font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid transparent}
.nl:hover{color:#ead08a}
.nl.on{color:#ead08a;border-color:rgba(234,208,138,.35);background:rgba(201,161,74,.08)}
</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; background: rgba(18,14,11,.94); border-bottom: 1px solid rgba(234,208,138,.16); font-family: 'Alegreya Sans', sans-serif; color: #efe6d2;">
<a href="Accueil.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto;">
<svg viewBox="0 0 40 40" style="width: 34px; height: 34px; flex: none;" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#c9a14a" stroke-width="1.5"></circle><path d="M20 3l3.2 13.8L37 20l-13.8 3.2L20 37l-3.2-13.8L3 20l13.8-3.2z" fill="#c9a14a"></path><circle cx="20" cy="20" r="2.4" fill="#ead08a"></circle></svg>
<span style="font-family: 'IM Fell English SC', serif; font-size: 24px; color: #ead08a; white-space: nowrap;">Le Pli des Pirates</span>
</a>
<nav aria-label="Navigation principale" style="display: flex; flex-wrap: wrap; gap: 4px;">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4"><a class="{{l.cls}}" href="{{l.href}}">{{l.label}}</a></sc-for>
</nav>
<a href="Profil.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid rgba(234,208,138,.3); text-decoration: none; background: rgba(0,0,0,.25);">
<dc-import name="Avatar" v="{{2}}" color="#d9b25a" size="{{36}}" hint-size="36px,36px"></dc-import>
<span style="display: flex; flex-direction: column; gap: 3px;">
<span style="font-weight: 800; font-size: 14px; color: #f2e7cd; line-height: 1;">Théo <span style="font-weight: 700; color: #ead08a;">· Niv. 12</span></span>
<span style="width: 96px; height: 5px; border-radius: 3px; background: rgba(234,208,138,.18); overflow: hidden;"><span style="display: block; width: 78%; height: 5px; background: #c9a14a;"></span></span>
</span>
</a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["accueil","classement","historique","regles","profil"],"default":"accueil"},"$preview":{"width":1440,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    var a = this.props.active || 'accueil';
    var L = [['accueil', 'Accueil', 'Accueil.dc.html'], ['classement', 'Classement', 'Classement.dc.html'], ['historique', 'Historique', 'Historique.dc.html'], ['regles', 'Règles', '#regles']];
    return { links: L.map(l => ({ label: l[1], href: l[2], cls: 'nl' + (a === l[0] ? ' on' : '') })) };
  }
}
</script>
</body>
</html>
