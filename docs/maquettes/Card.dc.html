<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&amp;family=IM+Fell+English+SC&amp;family=Alegreya+Sans:wght@400;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; padding: {{pad}}px; border-radius: {{rad}}px; background: {{frame}}; box-shadow: 0 6px 16px rgba(0,0,0,.45); font-family: 'Alegreya Sans', sans-serif;">
<div style="position: relative; height: 100%; box-sizing: border-box; border-radius: {{rad2}}px; background: #EFE3C8; border: 1px solid rgba(201,162,74,.65); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: {{gap}}px; overflow: hidden;">
<sc-if value="{{isNum}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; top: {{cpad}}px; left: {{cpad}}px; font-family: 'Pirata One', serif; font-size: {{fsRank}}px; line-height: 1; color: {{ink}};">{{rank}}</div>
<div style="position: absolute; bottom: {{cpad}}px; right: {{cpad}}px; font-family: 'Pirata One', serif; font-size: {{fsRank}}px; line-height: 1; color: {{ink}}; transform: rotate(180deg);">{{rank}}</div>
</sc-if>
<sc-if value="{{isSpecial}}" hint-placeholder-val="{{false}}">
<div style="font-family: 'IM Fell English SC', serif; font-size: {{fsKicker}}px; letter-spacing: .18em; color: {{frame}}; white-space: nowrap;">{{kicker}}</div>
</sc-if>
<div style="width: {{medal}}px; height: {{medal}}px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{frame}}; background: {{medalBg}}; color: {{ink}}; display: flex; align-items: center; justify-content: center; overflow: hidden;">
<sc-if value="{{g.coin}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" style="width: 78%; height: 78%; display: block;"><ellipse cx="50" cy="80" rx="26" ry="6" fill="#8A5E0E"></ellipse><circle cx="50" cy="44" r="28" fill="#D9AE45" stroke="#8A5E0E" stroke-width="3"></circle><circle cx="50" cy="44" r="21" fill="none" stroke="#8A5E0E" stroke-width="1.5" stroke-dasharray="2 3"></circle><path d="M50 30v28M36 44h28" stroke="#8A5E0E" stroke-width="6"></path></svg>
</sc-if>
<sc-if value="{{g.bird}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" style="width: 78%; height: 78%; display: block;"><path d="M52 70l-3 18 7-2 2-16z" fill="#2F6B3A"></path><path d="M52 22c-12 2-18 16-14 30 3 10 10 16 18 18l6-18c4-12 2-26-10-30z" fill="#2F6B3A"></path><circle cx="54" cy="24" r="10" fill="#2F6B3A"></circle><path d="M44 40c-4 10 0 22 10 26-2-10-2-20-10-26z" fill="#79A85F"></path><path d="M62 20c8 0 10 9 4 13 0-4-2-6-5-6z" fill="#231A12"></path><circle cx="56" cy="22" r="2.2" fill="#EFE3C8"></circle><path d="M20 76h60" stroke="#5A3E22" stroke-width="4" stroke-linecap="round"></path></svg>
</sc-if>
<sc-if value="{{g.star}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" style="width: 78%; height: 78%; display: block;"><circle cx="50" cy="50" r="36" fill="none" stroke="#5B3A7A" stroke-width="1.5"></circle><g transform="rotate(45 50 50)"><path d="M50 22l4 24 24 4-24 4-4 24-4-24-24-4 24-4z" fill="#A98BC4"></path></g><path d="M50 8l7 35 35 7-35 7-7 35-7-35-35-7 35-7z" fill="#5B3A7A"></path><circle cx="50" cy="50" r="4" fill="#EFE3C8"></circle></svg>
</sc-if>
<sc-if value="{{g.flag}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" style="width: 78%; height: 78%; display: block;"><path d="M24 12v80" stroke="#1B1B1F" stroke-width="5" stroke-linecap="round"></path><circle cx="24" cy="10" r="4" fill="#C9A24A"></circle><path d="M27 16c16-6 28 6 46 0 6-2 12-2 18 0v40c-12-4-22 4-34 2-12-2-20-8-30-4z" fill="#1B1B1F"></path><path d="M46 48l22-12M46 36l22 12" stroke="#EFE3C8" stroke-width="3.5" stroke-linecap="round"></path><circle cx="57" cy="31" r="8" fill="#EFE3C8"></circle><circle cx="54" cy="31" r="2" fill="#1B1B1F"></circle><circle cx="60" cy="31" r="2" fill="#1B1B1F"></circle></svg>
</sc-if>
<sc-if value="{{g.pirate}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" style="width: 100%; height: 100%; display: block;"><path d="M14 100c3-26 18-36 36-36s33 10 36 36z" fill="#15110E"></path><ellipse cx="50" cy="48" rx="14" ry="17" fill="#15110E"></ellipse><path d="M24 40c8-16 44-16 52 0-9 3-43 3-52 0z" fill="#15110E"></path><path d="M25 40c11 3 39 3 50 0" stroke="#C9A24A" stroke-width="2.5" fill="none"></path><path d="M70 30c8-10 18-10 22-6-7 0-13 3-18 8z" fill="#C9A24A"></path></svg>
</sc-if>
<sc-if value="{{g.mermaid}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" style="width: 100%; height: 100%; display: block;"><path d="M0 76c16-6 30 4 50 0s34-6 50 0v24H0z" fill="#0B3038"></path><path d="M46 20c-8 10-10 24-2 40 4 8 2 14-8 20 8 1 14-3 16-8 2 5 8 9 16 8-10-6-12-12-8-20 8-16 6-30-4-40" fill="#3FA59B"></path><circle cx="72" cy="22" r="7" fill="#EFE3C8"></circle></svg>
</sc-if>
</div>
<div style="font-family: 'IM Fell English SC', serif; font-size: {{fsBand}}px; letter-spacing: .12em; color: {{bandInk}}; background: {{frame}}; padding: 2px 8px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;">{{band}}</div>
<sc-if value="{{detail}}" hint-placeholder-val="{{false}}">
<div style="align-self: stretch; margin: 0 {{boxPad}}px; padding: {{boxPad}}px; border-radius: 6px; background: #F6EEDB; border: 1px solid rgba(201,162,74,.6); font-family: 'Alegreya Sans', sans-serif; font-size: {{fsDesc}}px; line-height: 1.32; color: #231A12; text-align: center; display: flex; flex-direction: column; gap: 6px;">
<span>{{desc}}</span>
<sc-if value="{{hasPower}}" hint-placeholder-val="{{false}}"><span style="border-top: 1px solid rgba(35,26,18,.3); padding-top: 6px; font-style: italic;">{{power}}</span></sc-if>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"card":{"editor":null},"detail":{"editor":"boolean","default":false},"w":{"editor":"int","default":120,"min":40,"max":300},"$preview":{"width":120,"height":168}}'>
class Component extends DCLogic {
  renderVals() {
    var c = this.props.card || { kind: 'num', suit: 'yellow', rank: 13 };
    var w = Number(this.props.w) || 120;
    var SUIT = {
      yellow: { f: '#A87A1C', ink: '#8A5E0E', band: 'Doublon', g: 'coin' },
      green: { f: '#2F6B3A', ink: '#2A5E33', band: 'Perroquet', g: 'bird' },
      purple: { f: '#5B3A7A', ink: '#5B3A7A', band: 'Carte marine', g: 'star' },
      black: { f: '#1B1B1F', ink: '#1B1B1F', band: 'Pavillon noir', g: 'flag' }
    };
    var frame, ink, band, glyph, medalBg = 'transparent', kicker = '', bandInk = '#F3E8CF';
    if (c.kind === 'pirate') { frame = '#5E1714'; ink = '#15110E'; band = c.name || 'Pirate'; glyph = 'pirate'; medalBg = '#2F5D66'; kicker = 'Pirate'; }
    else if (c.kind === 'mermaid') { frame = '#0F3F4A'; ink = '#3FA59B'; band = c.name || 'Sirène'; glyph = 'mermaid'; medalBg = '#164E5A'; kicker = 'Sirène'; }
    else { var s = SUIT[c.suit] || SUIT.yellow; frame = s.f; ink = s.ink; band = s.band; glyph = s.g; if (c.suit === 'black') bandInk = '#E3C47A'; }
    var desc, power = c.power || '';
    if (c.kind === 'pirate') desc = 'Bat toutes les cartes numérotées et les Sirènes. Entre pirates, le premier joué l\u2019emporte.';
    else if (c.kind === 'mermaid') desc = 'Bat les cartes numérotées et capture Barbe-Cendre (+40). Perd contre les Pirates.';
    else if (c.suit === 'black') desc = 'Atout : bat les trois autres couleurs.' + (c.rank === 14 ? ' +20 pour qui le capture.' : '');
    else desc = 'Fournissez cette couleur si elle est demandée.' + (c.rank === 14 ? ' +10 pour qui le capture.' : '');
    var detail = !!this.props.detail;
    var g = { coin: glyph === 'coin', bird: glyph === 'bird', star: glyph === 'star', flag: glyph === 'flag', pirate: glyph === 'pirate', mermaid: glyph === 'mermaid' };
    return {
      w: w, h: Math.round(w * 1.4), pad: Math.max(3, Math.round(w * .045)), rad: Math.round(w * .07), rad2: Math.round(w * .045),
      gap: Math.round(w * .06), cpad: Math.round(w * .05), fsRank: Math.round(w * .24), fsKicker: Math.max(7, Math.round(w * .075)),
      fsBand: Math.max(7, Math.round(w * .085)), medal: Math.round(w * (detail ? .4 : .56)),
      frame: frame, ink: ink, band: band, bandInk: bandInk, medalBg: medalBg, kicker: kicker, g: g,
      isNum: c.kind === 'num', isSpecial: c.kind !== 'num', rank: c.rank,
      detail: detail, desc: desc, power: power, hasPower: !!power, fsDesc: Math.round(w * .047), boxPad: Math.round(w * .035)
    };
  }
}
</script>
</body>
</html>
